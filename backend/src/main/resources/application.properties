spring.application.name=ImpactIQ
spring.profiles.default=dev
server.port=${SERVER_PORT:8080}
spring.config.import=optional:file:./.env[.properties]

gemini.api-key=${GEMINI_API_KEY:}
gemini.model=${GEMINI_MODEL:gemini-3.1-flash-lite}
gemini.timeout-ms=${GEMINI_TIMEOUT_MS:30000}

# Sessions and uploads
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.http-only=true
server.servlet.session.timeout=${SESSION_TIMEOUT:8h}
server.shutdown=graceful
spring.servlet.multipart.max-file-size=${UPLOAD_MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${UPLOAD_MAX_REQUEST_SIZE:11MB}

# Authentication (bootstrap admin is optional; supply credentials only through the environment)
impactiq.auth.registration-enabled=${IMPACTIQ_REGISTRATION_ENABLED:true}
impactiq.auth.bootstrap-admin-username=${IMPACTIQ_BOOTSTRAP_ADMIN_USERNAME:}
impactiq.auth.bootstrap-admin-password=${IMPACTIQ_BOOTSTRAP_ADMIN_PASSWORD:}

# Multi-agent investigation (engine: adk = Google ADK LlmAgent runtime, gemini = direct Interactions API)
impactiq.investigation.engine=${IMPACTIQ_AGENT_ENGINE:adk}
impactiq.investigation.max-output-tokens=${IMPACTIQ_AGENT_MAX_OUTPUT_TOKENS:2048}
# Gemini thinking level for agent calls: MINIMAL | LOW | MEDIUM | HIGH (blank = model default). Lower is faster.
impactiq.investigation.thinking-level=${IMPACTIQ_AGENT_THINKING_LEVEL:LOW}
impactiq.investigation.agent-max-attempts=2
impactiq.investigation.run-timeout-ms=${IMPACTIQ_INVESTIGATION_TIMEOUT_MS:240000}
impactiq.investigation.max-attempts=3
impactiq.investigation.max-active=4

# Project knowledge / RAG (storage must be outside the web root)
impactiq.knowledge.storage-dir=${IMPACTIQ_STORAGE_DIR:${user.home}/.impactiq/storage}
impactiq.knowledge.max-upload-bytes=10485760
impactiq.knowledge.embedding-model=${GEMINI_EMBEDDING_MODEL:gemini-embedding-001}
impactiq.knowledge.embedding-dimensions=768
impactiq.knowledge.embeddings-enabled=${IMPACTIQ_EMBEDDINGS_ENABLED:true}

# AI component discovery: after each indexed document, AI adds the components the document describes
impactiq.components.auto-discover=${IMPACTIQ_AUTO_COMPONENTS:true}
impactiq.components.max-per-run=8
impactiq.components.max-per-project=40

# Retention
impactiq.retention.audit-days=365
impactiq.retention.superseded-file-days=90

# AI Chatbot (limits are per user unless noted; max-concurrent is per application instance)
impactiq.chat.max-message-chars=4000
impactiq.chat.history-turns=10
impactiq.chat.rate-limit-per-minute=${IMPACTIQ_CHAT_RATE_LIMIT_PER_MINUTE:10}
impactiq.chat.timeout-ms=${IMPACTIQ_CHAT_TIMEOUT_MS:90000}
impactiq.chat.max-concurrent=4
impactiq.chat.retention-days=${IMPACTIQ_CHAT_RETENTION_DAYS:90}

# Trained triage model service (ml/serve.py). Off by default; investigations run unchanged without it.
impactiq.ml.enabled=${IMPACTIQ_ML_ENABLED:false}
impactiq.ml.url=${IMPACTIQ_ML_URL:http://localhost:8001}
impactiq.ml.timeout-ms=${IMPACTIQ_ML_TIMEOUT_MS:2000}

# Azure DevOps work item import (New Defect > Azure DevOps). The token comes only from the environment.
impactiq.azure-devops.base-url=${AZURE_DEVOPS_BASE_URL:https://dev.azure.com}
impactiq.azure-devops.pat=${AZURE_DEVOPS_PAT:}
impactiq.azure-devops.allowed-organizations=${AZURE_DEVOPS_ORGS:virtusaeag}
impactiq.azure-devops.timeout-ms=${AZURE_DEVOPS_TIMEOUT_MS:15000}
